spring:
  application:
    name: parking-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parking}
    username: ${DATABASE_USERNAME:parking}
    password: ${DATABASE_PASSWORD:parking}
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
